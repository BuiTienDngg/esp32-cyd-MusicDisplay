[platformio]
default_envs = esp32-cyd

[env:esp32-cyd]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<battery.cpp>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -std=gnu++17
    -include include/cyd_tft_setup.h
build_unflags = -std=gnu++11
lib_deps =
    mathertel/OneButton@2.6.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/tags/v1.4.zip

[env:esp32-cyd-calibration]
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -D CYD_TOUCH_CALIBRATION
build_src_filter = -<*> +<touch_calibration.cpp>
